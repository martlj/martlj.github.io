name: Update Publications from ORCID + Semantic Scholar

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch top 5 cited publications from ORCID + Semantic Scholar
        run: python scripts/fetch_publications.py "$(date -u +%Y-%m-%d)"

      - name: Commit changes if the publication list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          if git diff --cached --quiet; then
            echo "No changes to publications data."
          else
            git commit -m "Update publications from ORCID + Semantic Scholar"
            git push
          fi
