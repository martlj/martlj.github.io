title: "Martin Jones"
description: "Personal academic website"

# ---------------------------------------------------------------------
# BIO PAGE
# ---------------------------------------------------------------------

# Path to your photo. A placeholder is provided at first — see SETUP.md
# for how to upload your own photo and update this path.
photo: "/assets/images/profile.svg"

bio: >
  Martin Jones is the Deputy Head of Microscopy Prototyping in the Electron Microscopy STP at the Francis Crick Institute. He originally trained as a physicist and specialises in developing new hardware and software solutions for imaging and image analysis.

In the EM Science Technology Platform, Martin looks after the citizen science project Etch a Cell (https://www.zooniverse.org/projects/h-spiers/etch-a-cell) and works on several projects that aim to improve our efficiency at acquiring data and subsequently extracting meaning from it.

institute:
  name: "Francis Crick Institute"
  url: "https://www.crick.ac.uk/"

# Add, remove, or edit as many links as you like.
links:
  - label: "Email"
    url: "mailto:martin.jones@crick.ac.uk"
  - label: "GitHub"
    url: "https://github.com/martlj"
  - label: "BlueSky"
    url: "https://bsky.app/profile/martinjones.bsky.social"
  - label: "LinkedIn"
    url: "https://www.linkedin.com/in/martinljones"

# ---------------------------------------------------------------------
# SCIENTIFIC OUTPUTS PAGE
# ---------------------------------------------------------------------
# Paste your ORCID iD below (the full URL works too). It looks like:
#   0000-0002-1825-0097  or  https://orcid.org/0000-0002-1825-0097
# Don't have one? They're free and standard for researchers — sign up at
# https://orcid.org/register
#
# A GitHub Action checks this profile once a week and automatically
# updates _data/publications.yml with your 5 most-cited publications
# (citation counts come from Semantic Scholar). See the "Scientific
# Outputs page" section of SETUP.md for how to trigger it manually or
# edit the list by hand.
orcid:
  id: "0000-0003-0994-5652"

# ---------------------------------------------------------------------
# Jekyll / theme settings — no need to touch these
# ---------------------------------------------------------------------
theme: minima
markdown: kramdown
plugins:
  - jekyll-feed

exclude:
  - scripts/
  - requirements.txt
  - SETUP.md
  - Gemfile
  - Gemfile.lock
